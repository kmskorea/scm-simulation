<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ESS Supply Chain Digital Twin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111418'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%234C90F0'/%3E%3C/svg%3E" />
</head>
<body>
<div id="app">

  <!-- ── 상단바 ──────────────────────────────────────────────────────── -->
  <header id="topbar">
    <div class="brand"><span class="brand-mark"></span><span>ESS SCM TWIN</span></div>

    <nav class="tabstrip" id="tabstrip" role="tablist">
      <button class="tab" role="tab" data-view="NETWORK" aria-selected="true">Network</button>
      <button class="tab" role="tab" data-view="FLOW" aria-selected="false">Flow</button>
      <button class="tab" role="tab" data-view="COST" aria-selected="false">Cost</button>
    </nav>

    <div class="topbar-spacer"></div>

    <div class="topbar-right">
      <div class="segmented" id="mode-toggle" title="DESIGN: D+0부터 적용 · OPERATE: 플레이헤드 시점부터 적용">
        <button data-mode="DESIGN" aria-pressed="true">Design</button>
        <button data-mode="OPERATE" aria-pressed="false">Operate</button>
      </div>
      <button class="searchbar" id="search-open">
        <span>노드 · 고객 · PO 검색</span>
        <span class="topbar-spacer"></span>
        <span class="keycap">⌘K</span>
      </button>
      <select class="unit-select" id="unit-select" title="표시 단위 (원가는 항상 USD)"></select>
      <button class="icon-btn" id="btn-settings" title="설정 · 가정 · 내보내기">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="2.2" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" />
        </svg>
      </button>
      <button class="icon-btn" id="btn-share" title="현재 시나리오 링크 복사">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M6.5 9.5 9.5 6.5M6.8 4.2 8.2 2.8a2.5 2.5 0 0 1 3.5 3.5l-1.4 1.4M9.2 11.8l-1.4 1.4a2.5 2.5 0 0 1-3.5-3.5l1.4-1.4" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ── 어제 대비 델타 스트립 (§4.8) ─────────────────────────────────── -->
  <div id="delta-strip"></div>

  <!-- ── 좌측 아이콘 레일 ────────────────────────────────────────────── -->
  <nav id="rail"></nav>

  <!-- ── 좌측 패널 ───────────────────────────────────────────────────── -->
  <aside id="panel" hidden>
    <div class="panel-head">
      <span id="panel-title">PANEL</span>
      <button class="icon-btn" id="panel-close" title="닫기 (Esc)">
        <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.5"><path d="M2 2l8 8M10 2l-8 8" /></svg>
      </button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <!-- ── 메인 뷰 ─────────────────────────────────────────────────────── -->
  <main id="main">
    <section id="view-network"></section>
    <section id="view-flow" hidden></section>
    <section id="view-cost" hidden></section>
  </main>

  <!-- ── 우측 고정 패널 ──────────────────────────────────────────────── -->
  <aside id="right"></aside>

  <!-- ── 재생 바 ─────────────────────────────────────────────────────── -->
  <div id="transport">
    <button class="transport-btn" id="btn-back" title="7일 뒤로 (Shift+←)">◀◀</button>
    <button class="transport-btn" id="btn-play" title="재생 / 정지 (Space)">▶</button>
    <button class="transport-btn" id="btn-fwd" title="7일 앞으로 (Shift+→)">▶▶</button>
    <span id="playhead-label" class="mono">D+000 / 120</span>
    <input type="range" id="scrub" min="0" max="119" step="1" value="0" />
    <div class="segmented" id="speed-toggle">
      <button data-speed="0.5">0.5x</button>
      <button data-speed="1" aria-pressed="true">1x</button>
      <button data-speed="4">4x</button>
      <button data-speed="16">16x</button>
    </div>
    <button class="btn" id="btn-reset" title="전 레버·장애 초기화">⟲ Reset</button>
    <button class="btn" id="btn-cf" title="정보지연 0 · frozen 0 으로 재실행해 겹쳐 본다">◫ 반사실</button>
  </div>

  <!-- ── 하단 간트 ───────────────────────────────────────────────────── -->
  <div id="gantt"></div>
</div>

<div id="tooltip" hidden></div>

<!-- ── ⌘K 검색 ─────────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="search-modal" hidden>
  <div class="modal" role="dialog" aria-label="검색">
    <input id="search-input" placeholder="노드 · Lane · 고객 · PO 검색…" autocomplete="off" />
    <div id="search-results"></div>
  </div>
</div>

<!-- ── 설정 / 가정 / 내보내기 ──────────────────────────────────────── -->
<div class="modal-backdrop" id="settings-modal" hidden>
  <div class="modal" role="dialog" aria-label="설정">
    <div class="modal-head">
      <span>Settings · Assumptions · Export</span>
      <button class="icon-btn" data-close-modal>
        <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.5"><path d="M2 2l8 8M10 2l-8 8" /></svg>
      </button>
    </div>
    <div class="modal-body" id="settings-body"></div>
  </div>
</div>

<noscript style="position:fixed;inset:0;display:grid;place-items:center;font-family:monospace">
  이 앱은 ES modules 로 동작합니다. JavaScript 를 켜고 로컬 서버에서 열어 주세요 — python3 -m http.server
</noscript>

<script type="module" src="src/ui.js"></script>
</body>
</html>
